name: Build DevECS Native

# 构建 DevECS GDExtension (gdextension/) 并自动回写预编译产物。
#
# 触发条件: 仅当 C++ 源码/CMake/submodule/本文件 变化时构建,
#          避免自动回写的二进制提交再次触发本工作流(死循环)。
# 回写目录: addons/DEVFramework/Entity/ECS/Native/  (与本地构建一致)
# 产物命名: 与 devecs.gdextension 中的 8 个平台条目完全对齐
# 说明: 平台原生构建需对应 runner, 故用 matrix 在各自原生机器上编译。
#       windows/linux 固定 x86_64; macos 在 arm64(macos-14) 与 x86_64(macos-13) 上分别编译。

on:
  push:
    branches:
      - "**"
    paths:
      - "gdextension/src/**"
      - "gdextension/CMakeLists.txt"
      - ".gitmodules"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: "${{ matrix.platform }}-${{ matrix.arch }} (${{ matrix.config }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: macos-14
            platform: macos
            arch: arm64
          - os: macos-13
            platform: macos
            arch: x86_64
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 配置 CMake
        shell: bash
        env:
          BUILD_TYPE: ${{ matrix.config == 'debug' && 'Debug' || 'Release' }}
        run: |
          cmake -S gdextension -B build \
            -DGODOTCPP_API_VERSION=4.7 \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE"

      - name: 编译
        shell: bash
        env:
          BUILD_TYPE: ${{ matrix.config == 'debug' && 'Debug' || 'Release' }}
        run: |
          cmake --build build --config "$BUILD_TYPE"

      - name: 重命名产物并暂存
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          CONFIG: ${{ matrix.config }}
        run: |
          SRC_DIR="addons/DEVFramework/Entity/ECS/Native"
          mkdir -p native-out
          case "$PLATFORM" in
            windows)
              cp "$SRC_DIR/devecs.dll" "native-out/devecs.windows.${CONFIG}.x86_64.dll" ;;
            linux)
              cp "$SRC_DIR/libdevecs.so" "native-out/libdevecs.linux.${CONFIG}.x86_64.so" ;;
            macos)
              cp "$SRC_DIR/libdevecs.dylib" "native-out/libdevecs.macos.${CONFIG}.${ARCH}.dylib" ;;
          esac

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.config }}
          path: native-out/
          if-no-files-found: error

  commit:
    name: 汇总并回写二进制
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 复制到分发目录
        shell: bash
        run: |
          mkdir -p addons/DEVFramework/Entity/ECS/Native
          cp -f dist/* addons/DEVFramework/Entity/ECS/Native/
          ls -l addons/DEVFramework/Entity/ECS/Native/

      - name: 提交并推送 (仅当有变化)
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons/DEVFramework/Entity/ECS/Native/
          if git diff --cached --quiet; then
            echo "没有二进制变化，跳过提交"
          else
            git commit -m "chore(native): 自动重建 DevECS 预编译产物"
            git push origin "HEAD:$BRANCH"
          fi
